# @package _global_
benchmark_id: BNNBO
task_id: ${task.name}
task:
  _target_: carps.utils.task.Task
  name: bnnbo/SpeedReducer
  seed: ${seed}
  objective_function:
    _target_: carps.objective_functions.botorch.BOTorchObjectiveFunction
    botorch_problem:
      _target_: botorch.test_functions.synthetic.SpeedReducer
    seed: ${seed}
  input_space:
    _target_: carps.utils.task.InputSpace
    configuration_space:
      _target_: ConfigSpace.configuration_space.ConfigurationSpace.from_serialized_dict
      _convert_: object
      d:
        name: null
        hyperparameters:
        - type: uniform_float
          name: x0_cont
          lower: 2.6
          upper: 3.6
          default_value: 3.1
          log: false
          meta: null
        - type: uniform_float
          name: x1_cont
          lower: 0.7
          upper: 0.8
          default_value: 0.75
          log: false
          meta: null
        - type: uniform_float
          name: x2_cont
          lower: 17.0
          upper: 28.0
          default_value: 22.5
          log: false
          meta: null
        - type: uniform_float
          name: x3_cont
          lower: 7.3
          upper: 8.3
          default_value: 7.8
          log: false
          meta: null
        - type: uniform_float
          name: x4_cont
          lower: 7.8
          upper: 8.3
          default_value: 8.05
          log: false
          meta: null
        - type: uniform_float
          name: x5_cont
          lower: 2.9
          upper: 3.9
          default_value: 3.4
          log: false
          meta: null
        - type: uniform_float
          name: x6_cont
          lower: 5.0
          upper: 5.5
          default_value: 5.25
          log: false
          meta: null
        conditions: []
        forbiddens: []
        python_module_version: 1.2.0
        format_version: 0.4
    fidelity_space:
      _target_: carps.utils.task.FidelitySpace
      is_multifidelity: false
      fidelity_type: null
      min_fidelity: null
      max_fidelity: null
    instance_space: null
  output_space:
    _target_: carps.utils.task.OutputSpace
    n_objectives: 1
    objectives:
    - quality
  optimization_resources:
    _target_: carps.utils.task.OptimizationResources
    n_trials: 126
    time_budget: null
    n_workers: 1
  metadata:
    _target_: carps.utils.task.TaskMetadata
    has_constraints: false
    domain: real
    objective_function_approximation: real
    has_virtual_time: false
    deterministic: true
    dimensions: 7
    search_space_n_categoricals: 0
    search_space_n_ordinals: 0
    search_space_n_integers: 0
    search_space_n_floats: 7
    search_space_has_conditionals: false
    search_space_has_forbiddens: false
    search_space_has_priors: false
